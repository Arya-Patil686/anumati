[project]
name = "anumati"
version = "0.1.0"
description = "A conformance and dispute-evidence engine for AI-agent payments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlmodel>=0.0.22,<0.1",
    "cryptography>=43,<47",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Pulled in from M2 onwards. Kept out of the core install so `make test` stays fast.
engine = [
    "joserfc>=1.0,<2",
    "sentence-transformers>=3.0,<6",
    "httpx>=0.27,<1",
]
bench = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<23",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]
pdf = ["reportlab>=4.2,<5"]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.7,<0.20",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
